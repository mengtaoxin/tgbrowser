services:
  browser:
    build:
      context: ./docker/browser
    container_name: tgbrowser
    shm_size: "2gb"
    ports:
      # Host 9222 is often taken by local Chrome; keep 9229 on the host.
      - "9229:9222" # Chrome DevTools Protocol
      - "6080:6080" # noVNC (HITL)
    volumes:
      - browser-profile:/data/profile
    restart: unless-stopped

volumes:
  browser-profile:
